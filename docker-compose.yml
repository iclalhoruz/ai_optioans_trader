# Full topology for Aegis-OptionAI - `docker compose up -d --build` brings
# up Redis, all 4 services, and the autonomous scheduler.

networks:
  trader-network:
    driver: bridge

volumes:
  redis-data:

services:
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trader-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  broker-gateway:
    build:
      context: .
      dockerfile: services/broker-gateway/Dockerfile
    container_name: broker-gateway
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env's localhost defaults are for running on the host directly;
      # inside this network every other service is reachable by its
      # service name instead. Found live via a real `docker compose up`
      # run, one bug at a time: broker-gateway's own PipelineOrchestrator
      # couldn't reach Redis (every /runs call 503'd with "Connection
      # refused"), then, once that was fixed, couldn't reach ai-strategy
      # either (trade_proposal step failed) - same root cause, every
      # localhost default needs the same override here.
      REDIS_URL: redis://redis:6379/0
      AI_STRATEGY_URL: http://ai-strategy:8002
      CHAOS_SANDBOX_URL: http://chaos-sandbox:8003
      RISK_ENGINE_URL: http://risk-engine:8004
    networks:
      - trader-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # The autonomous piece - loops over WATCHLIST_TICKERS and triggers a run
  # every SCHEDULER_INTERVAL_MINUTES via broker-gateway's POST /runs.
  # No exposed port, not an HTTP service. restart: unless-stopped so it
  # keeps running unattended - every hour it's up before the deadline is
  # real trading history for the P&L judging criterion.
  scheduler:
    build:
      context: .
      dockerfile: workflow/Dockerfile
    container_name: aegis-scheduler
    depends_on:
      broker-gateway:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override .env's localhost default - inside this network the
      # service name is the hostname, not localhost.
      BROKER_GATEWAY_URL: http://broker-gateway:8001
    networks:
      - trader-network
    restart: unless-stopped

  ai-strategy:
    build:
      context: .
      dockerfile: services/ai-strategy/Dockerfile
    container_name: ai-strategy
    ports:
      - "8002:8002"
    depends_on:
      broker-gateway:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Same reason as scheduler's override below: .env's localhost default
      # is for running services directly on the host, but inside this
      # network broker-gateway is reachable by its service name, not
      # localhost - without this, ai-strategy's portfolio_value fetch (used
      # for real position sizing) silently fails and falls back to sizing
      # as if it knew nothing about the account.
      BROKER_GATEWAY_URL: http://broker-gateway:8001
    networks:
      - trader-network

  chaos-sandbox:
    build:
      context: .
      dockerfile: services/chaos-sandbox/Dockerfile
    container_name: chaos-sandbox
    ports:
      - "8003:8003"
    env_file:
      - .env
    networks:
      - trader-network

  risk-engine:
    build:
      context: .
      dockerfile: services/risk-engine/Dockerfile
    container_name: risk-engine
    ports:
      - "8004:8004"
    depends_on:
      broker-gateway:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Same fix as ai-strategy above - without this, risk-engine's own
      # get_portfolio_value() can't reach broker-gateway either, and the
      # allocation hard-veto silently checks against a hardcoded $100k
      # instead of the real account value.
      BROKER_GATEWAY_URL: http://broker-gateway:8001
    networks:
      - trader-network
